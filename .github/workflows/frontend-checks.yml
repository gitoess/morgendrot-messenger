# Messenger Next-App: ESLint (Feature-Grenzen), Typecheck, Vitest
name: Frontend checks

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'src/shared/**'
      - 'packages/morgendrot-core/**'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'src/shared/**'
      - 'packages/morgendrot-core/**'
      - '.github/workflows/frontend-checks.yml'

jobs:
  frontend:
    # Pin 24.04: ubuntu-latest moved to 26.04 (Oct/Nov 2026) and npm ci started
    # failing with exit 126 while the lockfile was unchanged since the last green run.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Kein Actions-npm-Cache: zwischen grünem und rotem Lauf flackerte npm ci
          # (Exit 1 in ~30s) bei unverändertem Lockfile — verdächtig für Cache-Korruption.

      - name: Node / npm versions
        run: |
          set -eux
          node -v
          npm -v
          command -v npm
          command -v node
          uname -a

      - name: npm ci
        run: |
          set -e
          if ! npm ci --no-fund --no-audit --prefer-online; then
            echo '::warning::npm ci failed — clean retry'
            npm cache clean --force || true
            rm -rf node_modules
            npm ci --no-fund --no-audit --prefer-online --loglevel=verbose
          fi

      - name: "@morgendrot/core unit tests"
        working-directory: packages/morgendrot-core
        env:
          CI: 'true'
        run: |
          set -e
          if ! npm ci --no-fund --no-audit --prefer-online; then
            npm cache clean --force || true
            rm -rf node_modules
            npm ci --no-fund --no-audit --prefer-online
          fi
          npm run test:unit

      - run: npm run lint

      - run: npm run check:circular

      - run: npx tsc --noEmit

      - name: Frontend Vitest (jsdom)
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          set +e
          npx vitest run --project frontend-jsdom \
            --reporter=default --reporter=github-actions \
            --reporter=json --outputFile=vitest-jsdom-report.json
          rc=$?
          if [ "$rc" -ne 0 ]; then
            if node scripts/vitest-jsdom-teardown-flake-guard.mjs vitest-jsdom-report.json; then
              exit 0
            fi
            echo "::warning::jsdom Vitest failed (exit $rc) — one retry with JSON report (Linux teardown flake)"
            npx vitest run --project frontend-jsdom \
              --reporter=default --reporter=github-actions \
              --reporter=json --outputFile=vitest-jsdom-retry.json
            rc=$?
            if [ "$rc" -ne 0 ]; then
              node scripts/vitest-jsdom-teardown-flake-guard.mjs vitest-jsdom-retry.json && exit 0
            fi
          fi
          exit $rc

      - name: Frontend Vitest (node)
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npx vitest run --project frontend-node

      - name: Next build (Morgendrot Projekt)
        run: npm run build

      - name: Next build (Morgendrot Messenger)
        run: npm run build:messenger
